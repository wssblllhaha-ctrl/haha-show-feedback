name: Bug 报告
description: 页面坏了、显示不对、点不动、加载不出来
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢来报 bug。不用写得很正式，把下面的填清楚就够我定位了。
        填不了的项可以留空，但**设备和系统外观**那两栏请尽量填 —— 很多问题只在特定环境下复现。

  - type: input
    id: where
    attributes:
      label: 在哪个页面
      description: 贴链接最好，或者写「首页 / 课程 / 带读 / 蜡笔那页」
      placeholder: https://haha.show/papers/
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 出了什么问题
      description: 看到的现象。哪个地方不对、变成了什么样？
      placeholder: 顶栏左边那行小字本来是灰的，现在变成白色了。
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      description: 手机型号 + 系统版本，桌面就写操作系统
      placeholder: iPhone 13 / iOS 18.2
    validations:
      required: true

  - type: dropdown
    id: appearance
    attributes:
      label: 系统外观（深色还是浅色）
      description: 这一栏最容易漏，也最可能直接决定能不能复现
      options:
        - 系统是浅色模式
        - 系统是深色模式
        - 不确定
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器
      description: Safari / Chrome / 微信内置 / Edge…能写版本更好
      placeholder: iOS Safari
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      description: 越具体越好。比如「第一次打开正常，下拉刷新之后才变」这种细节很关键
      placeholder: |
        1. 打开 https://haha.show/
        2. 随便点进一个页面
        3. 下拉刷新
        4. 顶栏小字变白
    validations:
      required: true

  - type: input
    id: firstload
    attributes:
      label: 第一次打开时是不是正常的
      description: 有些问题只在刷新后出现，这一栏能帮我把范围缩一半
      placeholder: 第一次打开正常，刷新后不正常
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 直接把图拖进来就行。麻烦打码掉私人信息
    validations:
      required: false
